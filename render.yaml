databases:
  - name: varsitypass-db
    plan: free
    databaseName: varsitypass
    user: varsitypass

services:
  - type: web
    name: varsitypass-backend
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: varsitypass-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
