databases:
  - name: learnza-db
    plan: free
    databaseName: learnza
    user: learnza

services:
  - type: web
    name: learnza-backend
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: learnza-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
