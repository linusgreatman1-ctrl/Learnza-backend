services:
  - type: web
    name: learnza-backend
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render's free plan allows only one free-tier database per account, already
      # in use by another project. Paste any Postgres connection string here instead
      # (e.g. a free instance from neon.tech or supabase.com, or a paid Render database).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
