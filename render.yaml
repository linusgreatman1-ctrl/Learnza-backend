databases:
  - name: campuspass-db
    plan: free
    databaseName: campuspass
    user: campuspass

services:
  - type: web
    name: campuspass-backend
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campuspass-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
