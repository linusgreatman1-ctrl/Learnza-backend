<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  // Same "redirect before paint" guard as app.html: a genuine reload (checking status
  // mid-application, or refreshing during a timed aptitude test) must never bounce
  // away, but a fresh/bookmarked visit -- no ?from=intro marker -- should land on the
  // introduction page first rather than straight on the raw apply/login form.
  (function () {
    try {
      var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
      var isReload = nav ? nav.type === 'reload' : (performance.navigation ? performance.navigation.type === 1 : true);
      var fromIntro = new URLSearchParams(location.search).get('from') === 'intro';
      if (!isReload && !fromIntro) location.replace('index.html');
    } catch (e) { /* fall through to the page's own render */ }
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23142033'/%3E%3Ctext x='32' y='46' font-family='Georgia, Cambria, serif' font-size='36' font-weight='700' fill='%23e3ac4c' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
<title>Apply — Learnza</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<style>
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .apply-box { width: 100%; max-width: 520px; padding: 32px; }
  .apply-box .brand { font-family: var(--font-display); font-size: 1.4rem; margin-bottom: 4px; }
  .confirm { text-align: center; padding: 20px 0; }
  .at-q { padding: 16px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; }
  .at-opt { padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; margin-top: 8px; cursor: pointer; }
  .at-opt.selected { border-color: var(--accent); background: var(--accent-soft); }
  .status-pill { display: inline-block; padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 0.85rem; }
  .tabs { display: flex; gap: 4px; background: var(--line); padding: 4px; border-radius: 999px; }
  .tab-btn { flex: 1; border: none; background: transparent; padding: 8px 10px; border-radius: 999px; font-weight: 600; font-size: 0.85rem; color: var(--ink-soft); cursor: pointer; }
  .tab-btn.active { background: var(--paper-raised); color: var(--ink); box-shadow: var(--shadow); }
  .error-box { background: var(--danger-soft); color: var(--danger); padding: 10px 14px; border-radius: 10px; font-size: 0.88rem; margin-bottom: 14px; }
  .notif-bell-btn { position: relative; background: transparent; border: none; font-size: 1.2rem; cursor: pointer; padding: 4px; line-height: 1; }
  .notif-badge { position: absolute; top: -3px; right: -4px; background: var(--danger); color: #fff; font-size: 0.62rem; font-weight: 700; border-radius: 999px; padding: 1px 5px; min-width: 15px; text-align: center; }
  .notif-panel { position: absolute; top: 34px; right: 0; width: 280px; max-height: 320px; overflow-y: auto; background: var(--paper-raised); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); z-index: 50; }
  .notif-item { padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; text-align: left; }
  .notif-item:last-child { border-bottom: none; }
  .notif-item.unread { background: var(--accent-soft); }
  .notif-item .notif-title { font-weight: 600; font-size: 0.83rem; }
  .notif-item .notif-body { font-size: 0.76rem; color: var(--ink-soft); margin-top: 2px; }
  .notif-item .notif-time { font-size: 0.68rem; color: var(--ink-soft); margin-top: 4px; }
</style>
</head>
<body>

<div class="card apply-box" id="box">
  <div style="display:flex; align-items:center; justify-content:space-between;">
    <div class="brand">Learnza</div>
    <div style="position:relative;">
      <button id="apt-notif-bell" class="notif-bell-btn" hidden title="Notifications">🔔<span class="notif-badge" id="apt-notif-badge" hidden>0</span></button>
      <div id="apt-notif-panel" class="notif-panel" hidden></div>
    </div>
  </div>
  <div class="muted" style="font-size:0.85rem; margin-bottom:18px;">Apply for admission</div>
  <div id="view"></div>
</div>

<script>
(function () {
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  const view = document.getElementById('view');
  // Same per-tab session strategy as app.html: localStorage alone is shared by every
  // tab of the site, so opening a fresh tab to register a *different* applicant was
  // showing whichever applicant was already logged in via any other tab. sessionStorage
  // is per-tab and wins when present; the localStorage fallback only kicks in on an
  // actual reload of this same tab (never on a genuinely new one), and this tab's own
  // sessionStorage is seeded from it immediately below so it stays independent of
  // whatever any other tab does after.
  function isPageReload() {
    try {
      const nav = performance.getEntriesByType('navigation')[0];
      if (nav) return nav.type === 'reload';
      if (performance.navigation) return performance.navigation.type === 1;
    } catch { /* Performance/Navigation Timing unavailable */ }
    return true;
  }
  const IS_RELOAD = isPageReload();
  let token = sessionStorage.getItem('applicant_token') || (IS_RELOAD ? localStorage.getItem('applicant_token') : null);
  if (token) sessionStorage.setItem('applicant_token', token);
  let examTimerHandle = null;

  // Show/hide toggle for every password field -- delegated on document so it works
  // for any .password-field/.pw-toggle-btn pair regardless of which form rendered it
  // or when, with nothing to wire up per-field.
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.pw-toggle-btn');
    if (!btn) return;
    const input = btn.parentElement.querySelector('input');
    if (!input) return;
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    btn.textContent = showing ? '👁' : '🙈';
  });

  async function api(path, opts = {}) {
    const headers = Object.assign({}, opts.headers || {});
    let body = opts.body;
    if (body && !(body instanceof FormData)) {
      headers['Content-Type'] = 'application/json';
      body = JSON.stringify(body);
    }
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const res = await fetch('/api' + path, { method: opts.method || 'GET', headers, body });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Something went wrong');
    return data;
  }

  function setToken(t) {
    token = t;
    sessionStorage.setItem('applicant_token', t);
    localStorage.setItem('applicant_token', t);
    refreshApplicantNotifications();
    connectNotificationSocket();
  }
  let notifSocket = null;
  function signOut() {
    token = null;
    sessionStorage.removeItem('applicant_token');
    localStorage.removeItem('applicant_token');
    document.getElementById('apt-notif-bell').hidden = true;
    document.getElementById('apt-notif-panel').hidden = true;
    if (notifSocket) { notifSocket.disconnect(); notifSocket = null; }
    renderAuth();
  }
  // Real-time push, same as the main app's bell -- a status change shows up the
  // instant it happens instead of waiting for the 20s poll below.
  function connectNotificationSocket() {
    if (!token || notifSocket) return;
    notifSocket = io('/notifications', { auth: { token } });
    notifSocket.on('notification:new', () => refreshApplicantNotifications());
  }

  // ---------------- Notification bell -- the in-app counterpart to the emails
  // admissions.js already sends on every status change, so a status update reaches
  // the applicant even if they don't happen to check their email. ----------------

  function timeAgo(iso) {
    const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 60) return 'just now';
    const m = Math.floor(s / 60); if (m < 60) return m + 'm ago';
    const h = Math.floor(m / 60); if (h < 24) return h + 'h ago';
    return Math.floor(h / 24) + 'd ago';
  }
  async function refreshApplicantNotifications() {
    if (!token) return;
    try {
      const { notifications, unreadCount } = await api('/applicant/notifications');
      document.getElementById('apt-notif-bell').hidden = false;
      const badge = document.getElementById('apt-notif-badge');
      badge.hidden = unreadCount === 0;
      badge.textContent = unreadCount > 9 ? '9+' : String(unreadCount);
      const panel = document.getElementById('apt-notif-panel');
      panel.innerHTML = notifications.map((n) => `
        <div class="notif-item ${n.read ? '' : 'unread'}" data-id="${n.id}">
          <div class="notif-title">${esc(n.title)}</div>
          <div class="notif-body">${esc(n.body)}</div>
          <div class="notif-time">${timeAgo(n.createdAt)}</div>
        </div>
      `).join('') || '<div class="notif-item"><span class="muted">No notifications yet.</span></div>';
      panel.querySelectorAll('.notif-item[data-id]').forEach((item) => {
        item.addEventListener('click', async () => {
          try { await api(`/applicant/notifications/${item.dataset.id}/read`, { method: 'POST' }); } catch {}
          panel.hidden = true;
          refreshApplicantNotifications();
          // Every notification an applicant gets -- status changed, admission letter
          // ready, aptitude test sent -- is something to act on from the dashboard
          // (it shows the current status, the letter download, and the "Start test"
          // button), so that's the one screen every click opens.
          renderDashboard();
        });
      });
    } catch { /* silent -- notifications are a convenience, not critical path */ }
  }
  document.getElementById('apt-notif-bell').addEventListener('click', () => {
    const panel = document.getElementById('apt-notif-panel');
    panel.hidden = !panel.hidden;
  });
  document.addEventListener('click', (e) => {
    const panel = document.getElementById('apt-notif-panel');
    const bell = document.getElementById('apt-notif-bell');
    if (!panel.hidden && !panel.contains(e.target) && e.target !== bell) panel.hidden = true;
  });
  // Catches a status change landing while the applicant is already sitting on their
  // dashboard, same 20s cadence as the main app's notification bell.
  setInterval(refreshApplicantNotifications, 20000);

  // ---------------- Auth (create account / log in) ----------------

  function renderAuth(mode) {
    mode = mode || 'register';
    view.innerHTML = `
      <div id="auth-error"></div>
      <div class="tabs" style="margin-bottom:18px;">
        <button class="tab-btn ${mode === 'register' ? 'active' : ''}" data-mode="register">Create account</button>
        <button class="tab-btn ${mode === 'login' ? 'active' : ''}" data-mode="login">Log in</button>
      </div>
      ${mode === 'register' ? `
        <p class="muted" style="font-size:0.82rem; margin-bottom:14px;">Create your applicant account first -- you'll use it to fill in and track your application from your own dashboard.</p>
        <form id="auth-form">
          <div class="field"><label>Full name</label><input type="text" id="rg-name" required></div>
          <div class="field"><label>Email</label><input type="email" id="rg-email" required></div>
          <div class="field"><label>Phone</label><input type="tel" id="rg-phone" required></div>
          <div class="field"><label>Password</label><div class="password-field"><input type="password" id="rg-password" required minlength="6"><button type="button" class="pw-toggle-btn" tabindex="-1">👁</button></div></div>
          <button class="btn btn-primary" style="width:100%; justify-content:center;" type="submit">Create account</button>
        </form>
      ` : `
        <form id="auth-form">
          <div class="field"><label>Email</label><input type="email" id="lg-email" required></div>
          <div class="field"><label>Password</label><div class="password-field"><input type="password" id="lg-password" required><button type="button" class="pw-toggle-btn" tabindex="-1">👁</button></div></div>
          <button class="btn btn-primary" style="width:100%; justify-content:center;" type="submit">Log in</button>
        </form>
      `}
      <a class="btn btn-ghost" href="index.html" style="width:100%; justify-content:center; margin-top:14px;">Back to Learnza</a>
    `;
    view.querySelectorAll('[data-mode]').forEach((btn) => btn.addEventListener('click', () => renderAuth(btn.dataset.mode)));
    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('auth-error');
      errorBox.innerHTML = '';
      try {
        const data = mode === 'register'
          ? await api('/applicant/register', { method: 'POST', body: {
              fullName: document.getElementById('rg-name').value.trim(),
              email: document.getElementById('rg-email').value.trim(),
              phone: document.getElementById('rg-phone').value.trim(),
              password: document.getElementById('rg-password').value,
            } })
          : await api('/applicant/login', { method: 'POST', body: {
              email: document.getElementById('lg-email').value.trim(),
              password: document.getElementById('lg-password').value,
            } });
        setToken(data.token);
        renderDashboard();
      } catch (err) {
        errorBox.innerHTML = `<div class="error-box">${esc(err.message)}</div>`;
      }
    });
  }

  // ---------------- Dashboard: status, or the "Apply" entry point ----------------

  const STATUS_LABEL = {
    SUBMITTED: ['Pending', 'pill-accent'],
    UNDER_REVIEW: ['Under review', 'pill-accent'],
    ACCEPTED: ['Accepted', 'pill-pass'],
    REJECTED: ['Not successful', 'pill-danger'],
    REGISTERED: ['Accepted — registered', 'pill-pass'],
  };

  async function renderDashboard() {
    view.innerHTML = '<p class="muted">Loading…</p>';
    let data;
    try { data = await api('/applicant/me'); } catch (err) { return renderAuth(); }
    const { applicant, application } = data;
    if (!application) {
      view.innerHTML = `
        <p>Welcome, ${esc(applicant.fullName)}.</p>
        <p class="muted" style="margin:10px 0 18px;">You haven't applied yet. Fill in your application details, upload your O-level result, and answer a short screening question to get started.</p>
        <button class="btn btn-primary" id="apply-btn" style="width:100%; justify-content:center;">Apply for Admission</button>
        <button class="btn btn-ghost" id="signout-btn" style="width:100%; justify-content:center; margin-top:10px;">Sign out</button>
        <a class="btn btn-ghost" href="index.html" style="width:100%; justify-content:center; margin-top:10px;">← Back to Learnza</a>
      `;
      document.getElementById('apply-btn').addEventListener('click', renderApplyForm);
      document.getElementById('signout-btn').addEventListener('click', signOut);
      return;
    }

    const [label, pillClass] = STATUS_LABEL[application.status] || [application.status, 'pill-muted'];
    const sub = application.aptitudeTestSubmission;
    view.innerHTML = `
      <p>Welcome, ${esc(applicant.fullName)}.</p>
      <div class="card" style="padding:18px; margin:14px 0;">
        <div class="muted" style="font-size:0.78rem; text-transform:uppercase; margin-bottom:6px;">Application status</div>
        <span class="status-pill ${pillClass}">${esc(label)}</span>
        <p class="meta" style="margin-top:10px;">${esc(application.department.name)} · ${esc(application.level)}</p>
      </div>
      ${decisionMessageHtml(application)}
      <div id="aptitude-box"></div>
      <button class="btn btn-ghost" id="signout-btn" style="width:100%; justify-content:center; margin-top:14px;">Sign out</button>
      <a class="btn btn-ghost" href="index.html" style="width:100%; justify-content:center; margin-top:10px;">← Back to Learnza</a>
    `;
    document.getElementById('signout-btn').addEventListener('click', signOut);
    renderAptitudeBox(sub, application.aptitudeScheduledAt);
  }

  // Written as a real admission decision letter would read, not an app notification --
  // this is the applicant's actual acceptance/rejection, not a status update.
  function decisionMessageHtml(application) {
    if (application.status === 'ACCEPTED' || application.status === 'REGISTERED') {
      const campus = application.school.location ? `, ${esc(application.school.location)} Campus,` : ',';
      return `
        <div class="card" style="padding:18px; margin-bottom:14px;">
          <p style="line-height:1.6;">Congratulations! You have been offered provisional admission to study <strong>${esc(application.department.name)}</strong> at <strong>${esc(application.school.name)}</strong>${campus} for a duration of three (3) academic years.</p>
          ${application.admissionLetterUrl
            ? `<a class="btn btn-primary" href="${esc(application.admissionLetterUrl)}" download="${esc(application.fullName.replace(/\s+/g, '_'))}_Admission_Letter${(application.admissionLetterUrl.match(/\.[a-zA-Z0-9]+$/) || [''])[0]}" style="width:100%; justify-content:center; margin-top:14px;">Download your admission letter</a>`
            : `<p class="meta" style="margin-top:14px;">Your admission letter will appear here as soon as the school uploads it.</p>`}
        </div>
      `;
    }
    if (application.status === 'REJECTED') {
      return `
        <div class="card" style="padding:18px; margin-bottom:14px;">
          <p style="line-height:1.6;">We regret to inform you that your application for admission was not successful.</p>
          <p style="line-height:1.6; margin-top:10px;">${application.rejectionReason ? `Reason: ${esc(application.rejectionReason)}` : 'After careful review, the school was unable to offer you admission to your chosen programme at this time.'}</p>
          <p class="meta" style="margin-top:10px;">We thank you for your interest and wish you the very best in your future endeavours.</p>
        </div>
      `;
    }
    return '';
  }

  function renderAptitudeBox(sub, scheduledAt) {
    const box = document.getElementById('aptitude-box');
    if (!box) return;
    if (sub && sub.submittedAt && !sub.gradedAt) {
      box.innerHTML = `
        <div class="card" style="padding:18px;">
          <div class="muted" style="font-size:0.78rem; text-transform:uppercase; margin-bottom:6px;">Aptitude test</div>
          <p style="margin-bottom:6px;">Submitted ${new Date(sub.submittedAt).toLocaleString()}</p>
          <p class="meta">Your school is still grading part of your test -- your score will appear here once that's done.</p>
        </div>
      `;
    } else if (sub && sub.submittedAt) {
      box.innerHTML = `
        <div class="card" style="padding:18px;">
          <div class="muted" style="font-size:0.78rem; text-transform:uppercase; margin-bottom:6px;">Aptitude test</div>
          <p style="font-size:1.3rem; font-weight:700;">${sub.score}%</p>
          <p class="meta">Submitted ${new Date(sub.submittedAt).toLocaleString()}</p>
        </div>
      `;
    } else if (sub && sub.sentAt) {
      box.innerHTML = `
        <div class="card" style="padding:18px;">
          <div class="muted" style="font-size:0.78rem; text-transform:uppercase; margin-bottom:6px;">Aptitude test</div>
          <p style="margin-bottom:12px;">Your school has sent your aptitude test. Once you start, the timer runs at 1 minute per question and cannot be paused.</p>
          <button class="btn btn-accent" id="start-test-btn" style="width:100%; justify-content:center;">Start test</button>
        </div>
      `;
      document.getElementById('start-test-btn').addEventListener('click', renderAptitudeTest);
    } else {
      box.innerHTML = `
        <div class="card" style="padding:18px;">
          <div class="muted" style="font-size:0.78rem; text-transform:uppercase; margin-bottom:6px;">Aptitude test</div>
          <p>The school hasn't sent your aptitude test yet. Expect it around <strong>${scheduledAt ? new Date(scheduledAt).toLocaleString() : 'a week after applying'}</strong> -- it will appear here, online, the moment it's sent.</p>
        </div>
      `;
    }
  }

  // ---------------- Application form (O-level result + screening question) ----------------

  async function renderApplyForm() {
    view.innerHTML = '<p class="muted">Loading…</p>';
    const [{ schools }, { question }] = await Promise.all([api('/schools'), api('/iq-question')]);
    let departments = [];
    async function loadDepartments(schoolId) {
      const { departments: d } = await api('/departments?schoolId=' + schoolId);
      departments = d;
      document.getElementById('ap-department').innerHTML = d.map((dep) => `<option value="${dep.id}">${esc(dep.name)}</option>`).join('');
    }
    view.innerHTML = `
      <div id="apply-error"></div>
      <form id="apply-form">
        <div class="field"><label>School</label><select id="ap-school">${schools.map((s) => `<option value="${s.id}">${esc(s.name)}${s.location ? ` (${esc(s.location)})` : ''}</option>`).join('')}</select></div>
        <div class="field"><label>Department</label><select id="ap-department"></select></div>
        <div class="field"><label>Level</label>
          <select id="ap-level"><option>NCE 1</option><option>NCE 2</option><option>NCE 3</option></select>
        </div>
        <div class="field"><label>O-level result type</label>
          <select id="ap-olevel-type">
            <option value="WAEC">WAEC</option>
            <option value="NECO">NECO</option>
            <option value="GCE">GCE</option>
            <option value="OTHER">Other equivalent</option>
          </select>
        </div>
        <div class="field"><label>Upload O-level result</label><input type="file" id="ap-olevel-file" accept="image/*,.pdf" required></div>
        <div class="field"><label>Why this programme? (optional)</label><textarea id="ap-statement"></textarea></div>
        <div class="field">
          <label>${esc(question.text)}</label>
          <div id="iq-options">
            ${question.options.map((opt, i) => `<div class="at-opt" data-opt="${i}">${esc(opt)}</div>`).join('')}
          </div>
        </div>
        <button class="btn btn-primary" style="width:100%; justify-content:center; margin-top:6px;" type="submit">Submit application</button>
      </form>
    `;
    if (schools.length) await loadDepartments(schools[0].id);
    document.getElementById('ap-school').addEventListener('change', (e) => loadDepartments(e.target.value));
    let iqChoice = null;
    view.querySelectorAll('#iq-options .at-opt').forEach((opt) => {
      opt.addEventListener('click', () => {
        view.querySelectorAll('#iq-options .at-opt').forEach((o) => o.classList.remove('selected'));
        opt.classList.add('selected');
        iqChoice = opt.dataset.opt;
      });
    });
    document.getElementById('apply-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('apply-error');
      errorBox.innerHTML = '';
      const file = document.getElementById('ap-olevel-file').files[0];
      if (!file) { errorBox.innerHTML = '<div class="error-box">Upload your O-level result.</div>'; return; }
      if (iqChoice === null) { errorBox.innerHTML = '<div class="error-box">Answer the screening question.</div>'; return; }
      const fd = new FormData();
      fd.append('schoolId', document.getElementById('ap-school').value);
      fd.append('departmentId', document.getElementById('ap-department').value);
      fd.append('level', document.getElementById('ap-level').value);
      fd.append('olevelType', document.getElementById('ap-olevel-type').value);
      fd.append('statement', document.getElementById('ap-statement').value);
      fd.append('iqChoice', iqChoice);
      fd.append('olevelResult', file);
      try {
        const data = await api('/admissions/apply', { method: 'POST', body: fd });
        renderApplySuccess(data.aptitudeScheduledAt);
      } catch (err) {
        errorBox.innerHTML = `<div class="error-box">${esc(err.message)}</div>`;
      }
    });
  }

  function renderApplySuccess(scheduledAt) {
    view.innerHTML = `
      <div class="confirm">
        <span class="pill pill-pass" style="margin-bottom:14px;">Application received</span>
        <p>Thanks — your application is in. Expect to write an online aptitude test from your dashboard around <strong>${new Date(scheduledAt).toLocaleString()}</strong>. The school will send it here when it's ready, with the timer starting the moment you open it.</p>
        <p class="muted" style="margin-top:12px;">While you wait, your application shows as Pending in your dashboard.</p>
        <button class="btn btn-primary" id="to-dash-btn" style="width:100%; justify-content:center; margin-top:16px;">Go to my dashboard</button>
      </div>
    `;
    document.getElementById('to-dash-btn').addEventListener('click', renderDashboard);
  }

  // ---------------- Timed aptitude test ----------------

  async function renderAptitudeTest() {
    view.innerHTML = '<p class="muted">Loading…</p>';
    const data = await api('/applicant/aptitude-test');
    if (data.submitted) return renderDashboard();
    if (!data.test) return renderDashboard();
    const { test, startedAt, durationMin } = data;
    const deadline = new Date(startedAt).getTime() + durationMin * 60000;
    const answers = {};
    view.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h3 style="font-size:1.1rem;">${esc(test.title)}</h3>
        <span class="pill pill-accent tabular" id="at-timer">--:--</span>
      </div>
      <div id="at-questions"></div>
      <button class="btn btn-primary" id="at-submit-btn" style="width:100%; justify-content:center; margin-top:10px;">Submit test</button>
    `;
    document.getElementById('at-questions').innerHTML = test.questions.map((q, qi) => `
      <div class="at-q" data-question="${q.id}">
        <div style="font-weight:600; margin-bottom:6px;">${qi + 1}. ${esc(q.text)}</div>
        ${q.questionType === 'THEORY'
          ? `<textarea data-theory="${q.id}" rows="4" style="width:100%;" placeholder="Type your answer here"></textarea>`
          : q.options.map((opt, oi) => `<div class="at-opt" data-q="${q.id}" data-opt="${oi}"><strong>${esc(String.fromCharCode(65 + oi))}.</strong> ${esc(opt)}</div>`).join('')}
      </div>
    `).join('');
    document.querySelectorAll('.at-opt').forEach((opt) => {
      opt.addEventListener('click', () => {
        const q = opt.dataset.q;
        document.querySelectorAll(`.at-opt[data-q="${q}"]`).forEach((o) => o.classList.remove('selected'));
        opt.classList.add('selected');
        answers[q] = Number(opt.dataset.opt);
      });
    });
    document.querySelectorAll('[data-theory]').forEach((ta) => {
      ta.addEventListener('input', () => { answers[ta.dataset.theory] = ta.value; });
    });
    async function doSubmit(auto) {
      if (examTimerHandle) { clearInterval(examTimerHandle); examTimerHandle = null; }
      const payload = test.questions.map((q) => (
        q.questionType === 'THEORY' ? { questionId: q.id, text: answers[q.id] || '' } : { questionId: q.id, choice: answers[q.id] }
      )).filter((a) => (a.text !== undefined && a.text !== '') || a.choice !== undefined);
      try {
        const result = await api('/applicant/aptitude-test/submit', { method: 'POST', body: { answers: payload } });
        view.innerHTML = `
          <div class="confirm">
            <span class="pill pill-pass" style="margin-bottom:14px;">Test submitted</span>
            ${auto ? '<p class="muted" style="margin-bottom:8px;">Time was up -- submitted automatically.</p>' : ''}
            ${result.pendingGrading
              ? '<p class="muted">Your school is still grading part of your test -- your score will appear on your dashboard once that\'s done.</p>'
              : `<p style="font-size:1.6rem; font-weight:700;">${result.score}%</p>`}
            <button class="btn btn-primary" id="to-dash-btn" style="width:100%; justify-content:center; margin-top:16px;">Go to my dashboard</button>
          </div>
        `;
        document.getElementById('to-dash-btn').addEventListener('click', renderDashboard);
      } catch (err) {
        alert(err.message);
        renderDashboard();
      }
    }
    document.getElementById('at-submit-btn').addEventListener('click', () => doSubmit(false));
    const timerEl = document.getElementById('at-timer');
    function tick() {
      const msLeft = deadline - Date.now();
      if (msLeft <= 0) { timerEl.textContent = '0:00'; doSubmit(true); return; }
      const totalSec = Math.floor(msLeft / 1000);
      timerEl.textContent = `${Math.floor(totalSec / 60)}:${String(totalSec % 60).padStart(2, '0')}`;
    }
    tick();
    examTimerHandle = setInterval(tick, 1000);
  }

  // A returning applicant clicking "My Application" from the intro page (still logged
  // in here) goes straight to their dashboard as usual; if their session isn't in this
  // browser, ?login=1 opens straight on the Log in tab instead of Create account, since
  // they're checking on an existing application, not starting a new one.
  const startedFromLoginLink = new URLSearchParams(location.search).get('login') === '1';
  if (token) { renderDashboard(); refreshApplicantNotifications(); connectNotificationSocket(); } else renderAuth(startedFromLoginLink ? 'login' : 'register');
})();
</script>
