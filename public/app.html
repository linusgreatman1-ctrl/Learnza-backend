<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusPass — App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  body { background: var(--paper); }
  #auth-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .auth-box { width: 100%; max-width: 420px; padding: 32px; }
  .auth-box .brand { font-family: var(--font-display); font-size: 1.4rem; margin-bottom: 4px; }
  .tabs { display: flex; gap: 4px; background: var(--line); padding: 4px; border-radius: 999px; margin: 18px 0 22px; }
  .tab-btn { flex: 1; border: none; background: transparent; padding: 8px 10px; border-radius: 999px; font-weight: 600; font-size: 0.85rem; color: var(--ink-soft); }
  .tab-btn.active { background: var(--paper-raised); color: var(--ink); box-shadow: var(--shadow); }
  .error-box { background: var(--danger-soft); color: var(--danger); padding: 10px 14px; border-radius: 10px; font-size: 0.88rem; margin-bottom: 14px; }
  .hint-box { background: var(--pass-soft); color: var(--pass); padding: 10px 14px; border-radius: 10px; font-size: 0.82rem; margin-top: 16px; line-height: 1.5; }

  #app-screen { display: none; min-height: 100vh; grid-template-columns: 232px 1fr; }
  #app-screen.active { display: grid; }
  .sidebar { border-right: 1px solid var(--line); padding: 20px 16px; display: flex; flex-direction: column; gap: 4px; }
  .sidebar .brand { font-family: var(--font-display); font-size: 1.2rem; margin-bottom: 4px; padding: 0 8px; }
  .sidebar .who { font-size: 0.78rem; color: var(--ink-soft); padding: 0 8px 16px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 10px; border-radius: 10px; font-weight: 600; font-size: 0.9rem; background: transparent; border: none; text-align: left; color: var(--ink); }
  .nav-item:hover { background: var(--accent-soft); }
  .nav-item.active { background: var(--ink); color: var(--paper); }
  .sidebar .spacer { flex: 1; }
  .sidebar .signout { color: var(--danger); font-size: 0.85rem; padding: 10px; }

  main.content { padding: 30px 34px; overflow-y: auto; }
  .page-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 22px; flex-wrap: wrap; gap: 10px; }
  .page-head h1 { font-size: 1.5rem; }

  .list-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); gap: 12px; }
  .list-row:last-child { border-bottom: none; }
  .list-row .meta { font-size: 0.82rem; color: var(--ink-soft); }

  .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .course-card { padding: 16px; cursor: pointer; transition: transform 0.1s ease; }
  .course-card:hover { transform: translateY(-2px); }
  .course-card .code { font-family: var(--font-display); font-size: 1.05rem; }

  .lesson-player { padding: 24px; }
  .lesson-player .controls { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .script-text { margin-top: 16px; padding: 16px; background: var(--paper); border-radius: 10px; border: 1px solid var(--line); max-height: 260px; overflow-y: auto; line-height: 1.7; }
  .speaking-word { background: var(--accent-soft); border-radius: 3px; }

  .quiz-q { padding: 18px; margin-bottom: 12px; }
  .quiz-opt { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; margin-top: 8px; cursor: pointer; }
  .quiz-opt.selected { border-color: var(--accent); background: var(--accent-soft); }
  .quiz-opt.correct { border-color: var(--pass); background: var(--pass-soft); }
  .quiz-opt.wrong { border-color: var(--danger); background: var(--danger-soft); }

  .chat-box { display: flex; flex-direction: column; height: 460px; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .chat-msg { max-width: 70%; padding: 9px 13px; border-radius: 14px; background: var(--paper); border: 1px solid var(--line); font-size: 0.9rem; }
  .chat-msg .sender { font-size: 0.72rem; font-weight: 700; color: var(--pass); margin-bottom: 2px; }
  .chat-input-row { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  .chat-input-row input { flex: 1; }

  table.data-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  table.data-table th { text-align: left; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft); padding: 8px 12px; border-bottom: 1px solid var(--line); }
  table.data-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); }

  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--ink); color: var(--paper); padding: 12px 18px; border-radius: 10px; box-shadow: var(--shadow); font-size: 0.88rem; z-index: 100; }

  @media (max-width: 760px) {
    #app-screen.active { grid-template-columns: 1fr; }
    .sidebar { display: flex; flex-direction: row; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--line); }
    .sidebar .who, .sidebar .brand { display: none; }
    .sidebar .spacer { display: none; }
  }
</style>
</head>
<body>

<div id="auth-screen">
  <div class="card auth-box">
    <div class="brand">CampusPass</div>
    <div class="muted" style="font-size:0.85rem;">Edo College of Education</div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="login">Log in</button>
      <button class="tab-btn" data-tab="register">Student sign up</button>
    </div>
    <div id="auth-error"></div>
    <form id="login-form">
      <div class="field"><label>Email</label><input type="email" id="login-email" required></div>
      <div class="field"><label>Password</label><input type="password" id="login-password" required></div>
      <button class="btn btn-primary" style="width:100%; justify-content:center;" type="submit">Log in</button>
    </form>
    <form id="register-form" style="display:none;">
      <div class="field"><label>Full name</label><input type="text" id="reg-name" required></div>
      <div class="field"><label>Email</label><input type="email" id="reg-email" required></div>
      <div class="field"><label>Password</label><input type="password" id="reg-password" required minlength="6"></div>
      <div class="field"><label>Matric number (optional)</label><input type="text" id="reg-matric"></div>
      <div class="field"><label>Department</label><select id="reg-department"></select></div>
      <button class="btn btn-accent" style="width:100%; justify-content:center;" type="submit">Create free account</button>
    </form>
    <div class="hint-box">
      Demo logins — Student: student@edocoe.edu.ng / Student@123 · Lecturer: lecturer@edocoe.edu.ng / Lecturer@123 · Admin: admin@edocoe.edu.ng / Admin@123
    </div>
  </div>
</div>

<div id="app-screen">
  <aside class="sidebar">
    <div class="brand">CampusPass</div>
    <div class="who" id="who-box"></div>
    <div id="nav-items"></div>
    <div class="spacer"></div>
    <button class="nav-item signout" id="signout-btn">Sign out</button>
  </aside>
  <main class="content" id="view"></main>
</div>

<script src="app.js"></script>
</body>
</html>
